global:
  scrape_interval: 30s
  scrape_timeout: 20s

scrape_configs:
  - job_name: modem
    metrics_path: /metrics
    static_configs:
      - targets: ["modem-exporter:9210"]

  # End-to-end reachability (the "effect" side, complementing modem signal).
  # probe_success{instance=...} = 1 up / 0 down; loss% = 1 - avg_over_time(probe_success[w]).
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 1.1.1.1            # Cloudflare — neutral internet anchor
          - 8.8.8.8            # Google — second anchor (redundancy)
          - 192.168.0.1        # LAN gateway/modem — isolates LAN vs ISP
          - kakol.dev          # end-to-end to own infra
        labels:
          probe: ping
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # TCP:443 to kakol.dev — liveness that survives ICMP filtering upstream.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - kakol.dev:443
        labels:
          probe: tcp443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
